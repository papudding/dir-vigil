[package]
name = "dir-vigil"
version = "0.2.0"
edition = "2021"
description = "Time-triggered directory cleanup tool with TOTP keepalive (dead man's switch)"
license = "MIT"
repository = "https://github.com/papudding/dir-vigil"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
otpauth = "0.5.1"
aes-gcm = "0.10"
tempfile = "3.19.1"
rand = "0.9"
data-encoding = "2"
qrcode = "0.14"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
