# Rate limiting zones are declared in the http context provided by the
# nginx base image (conf.d/*.conf is included from inside http {}).
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# Log only the path, never the query string: keep the access log free of
# captcha / TOTP values (they are sent in a POST body now, but keep this safe).
log_format safe '$remote_addr - [$time_local] "$request_method $uri" $status';

server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 16k;

    limit_req_status 429;

    access_log /dev/stdout safe;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端静态文件服务
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Rsbuild 产物带内容 hash，可长期缓存
    location ~* \.(?:js|css|svg)$ {
        root /usr/share/nginx/html;
        expires 30d;
        try_files $uri =404;
    }

    # 后端 API 反向代理（TOTP / captcha 已改为 POST body）
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
